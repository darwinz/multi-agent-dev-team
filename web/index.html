<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coder agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%2358a6ff%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Coder <span>agent</span></div>
  <form id="run-form">
    <input id="task" type="text" autocomplete="off" placeholder="Describe a coding task, e.g. a palindrome checker with pytest tests">
    <button id="run" type="submit">Run</button>
  </form>
  <div class="counter" title="model calls used / limit"><span id="iter">0</span>/<span id="max">10</span></div>
</header>
<main class="layout">
  <aside class="pane files">
    <h2>Workspace</h2>
    <ul id="tree"><li class="empty">No files yet</li></ul>
  </aside>
  <section class="pane editor">
    <div class="tab" id="file-name">No file selected</div>
    <pre class="code"><code id="code" class="language-python"></code></pre>
    <div class="terminal">
      <div class="tab">Terminal: last exec_python</div>
      <pre id="terminal">Waiting for a run.</pre>
    </div>
  </section>
  <aside class="pane agent">
    <h2>Agent</h2>
    <ol id="timeline"></ol>
    <div id="result" hidden></div>
  </aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
