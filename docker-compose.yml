# Team BST demo (default): cp .env.example .env, fill in ANTHROPIC_API_KEY, then `docker compose up --build`
#   or, with no plaintext keys on disk: op run --env-file=.env.op -- docker compose up --build
# Chroma starts first and must report healthy before the team runs; it keeps running after the team exits.
# Web UI:   docker compose --profile web up web          CLI: docker compose run --rm coder "your task"
# On Linux, build with your own ids so the mounted dirs stay yours: UID=$(id -u) GID=$(id -g) docker compose build
x-app: &app
  build:
    context: .
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: multi-agent-dev-team:latest
  depends_on:
    chroma:
      condition: service_healthy
  # Grader path: a plain .env. Brandon's path: no .env, the same names come from `op run` via `environment:`.
  env_file:
    - path: .env
      required: false
  # Name-only passthrough: a variable set on the host wins over .env; one unset on the host leaves .env's value
  environment:
    ANTHROPIC_API_KEY:
    LANGSMITH_TRACING:
    LANGSMITH_API_KEY:
    LANGSMITH_PROJECT:
    PM_MODEL:
    CODER_MODEL:
    QA_MODEL:
    CODER_MAX_ITERATIONS:
    QA_MAX_ITERATIONS:
    EXEC_TIMEOUT_SECONDS:
    MEMORY_WINDOW_TURNS:
    RETRY_MAX:
    RETRY_BASE_DELAY_S:
    RETRY_MAX_DELAY_S:
    BREAKER_FAILURE_THRESHOLD:
    BREAKER_COOLDOWN_S:
    CACHE_TTL_S:
    LOG_LEVEL:
    CHROMA_HOST: chroma
    CHROMA_PORT: "8000"
  volumes:
    - ./workspace:/app/workspace
    - ./.coder:/app/.coder
    - ./docs/cost_reports:/app/docs/cost_reports

services:
  chroma:
    image: chromadb/chroma:1.5.9  # matches the locked chromadb client (uv.lock)
    volumes:
      - chroma-data:/data
    healthcheck:
      # The image has no curl/wget/python: bash's /dev/tcp sends the GET and the status line must be 200
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 5s
      retries: 20
      start_period: 10s

  team:
    <<: *app

  web:
    <<: *app
    entrypoint: ["coder-web"]
    command: []
    profiles: ["web"]
    ports:
      - "127.0.0.1:8000:8000"

  coder:
    <<: *app
    entrypoint: ["coder"]
    command: []
    profiles: ["cli"]

volumes:
  chroma-data:
