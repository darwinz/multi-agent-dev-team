[project]
name = "multi-agent-dev-team"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "filelock>=4.2.4",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langgraph>=1.2.18",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
openai = [
    "langchain-openai>=1.7.3",
]
ollama = [
    "langchain-ollama>=1.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

[project.scripts]
coder = "app.cli:main"
coder-web = "app.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "tools", "memory", "orchestration", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real model provider"]
addopts = "-p no:cacheprovider"
